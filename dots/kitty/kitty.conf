# kitty.conf
# Traduzido do perfil Konsole "Perfil 1" (esquema WhiteOnBlack) em 2026-09-14.
# Fonte: perfil não define Font=, então o Konsole usa o monospace padrão do
# sistema (fc-match monospace -> Noto Sans Mono).

font_family      Noto Sans Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 10.0

# Konsole real: ~/.local/share/konsole/WhiteOnBlack.colorscheme (schema
# customizado do usuário, não o padrão genérico do sistema) tem Blur=true e
# Opacity=0.64 — é esse o valor certo.
background_opacity 0.64
dynamic_background_opacity yes

initial_window_width  95c
initial_window_height 30c

window_padding_width 4

# Cores extraídas de WhiteOnBlack.colorscheme
foreground #ffffff
background #0b0b0b
cursor     #ffffff

color0  #000000
color8  #686868
color1  #b21818
color9  #ff5454
color2  #18b218
color10 #54ff54
color3  #b26818
color11 #ffff54
color4  #1818b2
color12 #5454ff
color5  #b218b2
color13 #ff54ff
color6  #18b2b2
color14 #54ffff
color7  #b2b2b2
color15 #ffffff

confirm_os_window_close 0

# Copiar/colar com Ctrl+C/Ctrl+V (igual ao Konsole reconfigurado, em vez do
# padrão do kitty que é Ctrl+Shift+C/V). copy_or_interrupt copia se houver
# seleção; senão manda o Ctrl+C normal (SIGINT) pro programa em foco.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

include colors-wallust.conf

# wallust v4 — gera a paleta do sistema a partir do wallpaper atual do
# waywallen. Documentação: man wallust.5 / man wallust.
#
# palette=kmeans agrupa os pixels em Lab e usa os centroides, ou seja,
# devolve as cores que o wallpaper realmente tem.
#
# Antes era salience com sampling=high/intensity=vibrant mais saturation=65,
# afinado para wallpapers escuros com neon. O problema é que aquilo **fabrica**
# cor: num wallpaper quase neutro (branco, cinza), empurrar a saturação ao
# máximo aterrissa no vermelho, e a paleta inteira saía vermelha sem haver
# vermelho nenhum na imagem. Em um dos wallpapers a combinação nem gerava
# paleta. Com kmeans o branco sai branco e o acento forte continua aparecendo.
#
# Para voltar ao comportamento antigo: `rice-colors palette salience`.
#
# style=dark mantém fundo escuro e texto claro; o rice-colors ainda escurece o
# fundo por conta própria se algum wallpaper passar por cima disso.

backend = "full"
palette = "kmeans"
style = "dark"

use16cols = true
check_contrast = true

[templates]
hyprland   = { template = 'hyprland-colors.conf', target = '~/.config/hypr/colors.conf' }
hyprlock   = { template = 'hyprlock-colors.conf', target = '~/.config/hypr/hyprlock-colors.conf' }
waybar     = { template = 'waybar-colors.css',    target = '~/.cache/wallust/colors-waybar.css' }
kitty      = { template = 'kitty-colors.conf',    target = '~/.config/kitty/colors-wallust.conf' }
mako       = { template = 'mako-colors',          target = '~/.config/mako/colors' }
# O hub em Quickshell lê esse JSON direto via FileView (watchChanges: true) —
# não precisa de hook de reload aqui, o próprio QML recarrega sozinho quando
# o arquivo muda.
quickshell = { template = 'quickshell-colors.json', target = '~/.cache/wallust/colors-quickshell.json' }
sddm       = { template = 'sddm-theme.conf', target = '/usr/share/sddm/themes/SilentSDDM/configs/default-left.conf' }

[hooks]
# Recarrega cada programa pra pegar a paleta nova sem precisar reiniciar.
waybar = "pkill -SIGUSR2 waybar"
kitty  = "pkill -SIGUSR1 kitty"
mako   = "makoctl reload"

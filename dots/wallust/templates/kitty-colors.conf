# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Gerado automaticamente pelo wallust a partir do wallpaper atual.
# NAO EDITE ESTE ARQUIVO A MAO — sobrescrito a cada `wallust run`.
# Editar o template em: ~/.config/wallust/templates/kitty-colors.conf
#
# palette = "salience" (wallust.toml) puxa as cores mais salientes do
# wallpaper pra manter acentos vívidos no Hyprland/Quickshell — mas em
# wallpapers escuros e monocromáticos isso deixa color0-14 quase do mesmo
# tom escuro do fundo, ilegível no terminal. check_contrast=true sozinho não
# resolve. Em vez de mudar a paleta global (afetaria o visual do resto do
# rice), só o texto do terminal recebe um lighten() aqui — as outras
# ferramentas continuam com as cores originais e mais vívidas.
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

foreground {{foreground}}
background {{background}}
cursor     {{cursor}}

color0  {{color0  | lighten(0.40)}}
color1  {{color1  | lighten(0.22)}}
color2  {{color2  | lighten(0.22)}}
color3  {{color3  | lighten(0.22)}}
color4  {{color4  | lighten(0.22)}}
color5  {{color5  | lighten(0.22)}}
color6  {{color6  | lighten(0.22)}}
color7  {{color7  | lighten(0.10)}}
color8  {{color8  | lighten(0.30)}}
color9  {{color9  | lighten(0.18)}}
color10 {{color10 | lighten(0.18)}}
color11 {{color11 | lighten(0.18)}}
color12 {{color12 | lighten(0.18)}}
color13 {{color13 | lighten(0.18)}}
color14 {{color14 | lighten(0.18)}}
color15 {{color15}}

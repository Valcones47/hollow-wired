# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Gerado automaticamente pelo wallust a partir do wallpaper atual.
# NÃO EDITE ESTE ARQUIVO À MÃO — sobrescrito a cada `wallust run`.
# Editar o template em: ~/.config/wallust/templates/hyprlock-colors.conf
#
# Arquivo separado do colors.conf porque o hyprlock precisa das cores já no
# formato rgb(): ele não aceita `#RRGGBB`, e o hyprlang não expande uma
# variável definida a partir de outra ($a = $b devolve vazio).
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

$lock_accent = rgb({{color4 | strip}})
$lock_accent2 = rgb({{color6 | strip}})
$lock_fg = rgb({{foreground | strip}})
$lock_bg = rgb({{background | strip}})

[General]
enable-animations = true
animated-background-placeholder = ""

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 50
padding-left = 50
background = "current.png"
use-background-color = false
background-color = "{{background}}"
blur = 0
brightness = 0.0

[LockScreen.Clock]
display = true
position = top-left
align = center
format = hh:mm
font-family = Noto Sans
font-size = 110
font-weight = 800
color = "{{color10}}"

[LockScreen.Date]
display = true
format = dddd, d 'de' MMMM
font-family = Noto Sans
font-size = 22
font-weight = 500
color = "{{color7}}"
margin-top = -12

[LockScreen.Message]
display = true
position = bottom-left
align = left
text = Pressione qualquer tecla para entrar
font-family = Noto Sans
font-size = 15
font-weight = 400
display-icon = true
icon = enter.svg
icon-size = 16
color = "{{color7}}"
paint-icon = true
spacing = 8

[LoginScreen]
background = "current.png"
use-background-color = false
background-color = "{{background}}"
blur = 45
brightness = -0.15

[LoginScreen.LoginArea]
position = center
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = circle
border-radius = 60
active-size = 110
inactive-size = 75
inactive-opacity = 0.40
active-border-size = 2
inactive-border-size = 1
active-border-color = "{{color10}}"
inactive-border-color = "{{color8}}"

[LoginScreen.LoginArea.Username]
font-family = Noto Sans
font-size = 18
font-weight = 700
color = "{{foreground}}"
margin = 12

[LoginScreen.LoginArea.PasswordInput]
width = 230
height = 38
display-icon = true
font-family = Noto Sans
font-size = 13
icon = password.svg
icon-size = 16
content-color = "{{foreground}}"
background-color = "{{background}}"
background-opacity = 0.75
border-size = 1
border-color = "{{color10}}"
border-radius-left = 12
border-radius-right = 12
margin-top = 10

[LoginScreen.LoginArea.LoginButton]
background-color = "{{color10}}"
background-opacity = 0.85
active-background-color = "{{color10}}"
active-background-opacity = 1.0
content-color = "{{background}}"
active-content-color = "{{background}}"
border-size = 0
border-radius = 12
size = 38
icon-size = 18

[LoginScreen.LoginArea.Spinner]
display = true
size = 38
color = "{{color10}}"

[LoginScreen.LoginArea.WarningMessage]
font-family = Noto Sans
font-size = 11
font-weight = 500
color = "{{color10}}"
margin-top = 8

[LoginScreen.MenuArea.Buttons]
size = 38
font-family = Noto Sans
border-radius = 12
margin = 24

[LoginScreen.MenuArea.Popups]
max-height = 240
item-height = 38
item-spacing = 4
padding = 8
display-scrollbar = true
margin = 8
background-color = "{{background}}"
background-opacity = 0.90
active-option-background-color = "{{color10}}"
active-option-background-opacity = 0.30
content-color = "{{foreground}}"
active-content-color = "{{color10}}"
font-family = Noto Sans
border-size = 1
border-color = "{{color10}}"
font-size = 13
icon-size = 20

[LoginScreen.MenuArea.Session]
display = true
position = bottom-left
index = 0
popup-direction = up
popup-align = left
display-session-name = true
button-width = 220
popup-width = 240
background-color = "{{background}}"
background-opacity = 0.70
active-background-opacity = 0.90
content-color = "{{foreground}}"
active-content-color = "{{color10}}"
border-size = 1
font-size = 13
icon-size = 20

[LoginScreen.MenuArea.Layout]
display = false
position = bottom-right
index = 1
popup-direction = up
popup-align = center
popup-width = 180
display-layout-name = true
background-color = "{{background}}"
background-opacity = 0.70
active-background-opacity = 0.90
content-color = "{{foreground}}"
active-content-color = "{{color10}}"
border-size = 1
font-size = 11
icon = language.svg
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = bottom-right
index = 1
background-color = "{{background}}"
background-opacity = 0.70
active-background-opacity = 0.90
content-color = "{{foreground}}"
active-content-color = "{{color10}}"
border-size = 1
icon = keyboard.svg
icon-size = 18

[LoginScreen.MenuArea.Power]
display = true
position = bottom-right
index = 0
popup-direction = up
popup-align = center
popup-width = 160
background-color = "{{background}}"
background-opacity = 0.70
active-background-opacity = 0.90
content-color = "{{foreground}}"
active-content-color = "{{color10}}"
border-size = 1
icon = power.svg
icon-size = 18

[LoginScreen.VirtualKeyboard]
background-color = "{{background}}"
background-opacity = 0.85
content-color = "{{foreground}}"
active-content-color = "{{color10}}"
key-border-color = "{{color8}}"
key-border-size = 1
key-border-radius = 6

[Tooltips]
display = true
padding = 6
font-family = Noto Sans
font-size = 11
color = "{{foreground}}"
background-color = "{{background}}"
background-opacity = 0.90
border-radius = 6
border-size = 1
border-color = "{{color8}}"

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Gerado automaticamente pelo wallust a partir do wallpaper atual.
# NÃO EDITE ESTE ARQUIVO À MÃO — sobrescrito a cada `wallust run`.
# Editar o template em: ~/.config/wallust/templates/hyprland-colors.conf
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

$wallust_background = {{background}}
$wallust_foreground = {{foreground}}
$wallust_accent1 = {{color4}}
$wallust_accent2 = {{color6}}

$wallust_active_border = rgba({{color4 | strip}}ee) rgba({{color6 | strip}}ee) 45deg
$wallust_inactive_border = rgba({{background | strip}}88)
$wallust_shadow_color = rgba({{background | strip}}ee)

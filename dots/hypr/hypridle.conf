# hypridle.conf
# Sem bloqueio nem suspensão por ociosidade (o usuário não quer ter que
# digitar a senha de novo só por ter ficado parado). general.lock_cmd só é
# usado se algo pedir lock explicitamente (Super+L, ou suspensão manual via
# before_sleep_cmd abaixo) — não é chamado por nenhum listener aqui.

general {
    # O clima da tela de bloqueio sai de um cache: buscar na hora travaria o
    # desenho da tela. O refresh roda em segundo plano e só vai à rede se o
    # cache tiver mais de 30 min.
    lock_cmd = rice-lock-info weather-refresh & pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Único comportamento automático por ociosidade: escurece a tela pela
# metade do brilho atual depois de 30 minutos sem uso (não bloqueia, não
# desliga a tela, não suspende). Volta pro brilho de antes sozinho ao
# detectar atividade de novo.
listener {
    timeout = 1800
    on-timeout = bash -c 'h=$(( $(brightnessctl get) * 50 / $(brightnessctl max) )); brightnessctl -s set ${h}%'
    on-resume = brightnessctl -r
}

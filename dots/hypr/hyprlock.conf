# ==============================================================================
# hyprlock.conf — tela de bloqueio do hollow-wired.
#
# Cartão central em vidro fosco sobre a área de trabalho desfocada, no lugar do
# fundo preto sólido que existia antes.
#
# `path = screenshot` usa o que está na tela no momento do bloqueio. É o que
# funciona com wallpaper animado: apontar para um arquivo mostraria um quadro
# qualquer, e o Wallpaper Engine nem sempre tem um arquivo de imagem para
# apontar. Com blur alto o conteúdo das janelas não é legível.
#
# As cores vêm do wallust, então a tela de bloqueio acompanha o papel de parede.
# O arquivo é próprio do hyprlock (hyprlock-colors.conf) porque ele não aceita
# cor em `#RRGGBB`, que é o formato do colors.conf — e o hyprlang não expande
# uma variável definida a partir de outra, então `$accent = $wallust_accent1`
# resolveria para vazio.
# ==============================================================================

source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    # Sem isso, errar a senha uma vez deixa o campo travado até o fade acabar.
    immediate_render = true
}

animations {
    enabled = true
    bezier = suave, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 5, suave
    animation = fadeOut, 1, 4, suave
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.0115
    contrast = 0.90
    brightness = 0.45
    vibrancy = 0.20
    vibrancy_darkness = 0.05
}

# ------------------------------------------------------------------ cartão

shape {
    monitor =
    size = 840, 410
    color = rgba(0, 0, 0, 0.42)
    rounding = 30
    border_size = 2
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, 0
    halign = center
    valign = center
}

# ------------------------------------------------------------------ topo

# Foto do usuário. `path` é estático no hyprlock, então quem descobre o arquivo
# certo é o reload_cmd: ~/.face existe em PNG, WebP ou nem existe, dependendo de
# como a conta foi criada. Sem foto o hyprlock só não desenha nada aqui.
image {
    monitor =
    path = ~/.face
    reload_cmd = rice-lock-info avatar
    reload_time = 300
    size = 78
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.18)
    position = 0, 268
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] rice-lock-info greeting
    color = $lock_accent
    font_size = 15
    font_family = Fira Sans Medium
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = $lock_fg
    font_size = 82
    font_family = Fira Sans Light
    position = 0, 78
    halign = center
    valign = center
}

label {
    monitor =
    # O hyprlock não tem locale próprio: sem LC_TIME o dia da semana sai em
    # inglês mesmo com o sistema em português.
    text = cmd[update:30000] LC_TIME=pt_BR.UTF-8 date +'%A · %d de %B'
    color = rgba(255, 255, 255, 0.72)
    font_size = 15
    font_family = Fira Sans
    position = 0, 14
    halign = center
    valign = center
}

# ------------------------------------------------------------------ senha

input-field {
    monitor =
    size = 330, 50
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.34
    dots_center = true
    rounding = 25
    outer_color = rgba(255, 255, 255, 0.14)
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = $lock_fg
    check_color = $lock_accent
    fail_color = rgb(220, 60, 70)
    fade_on_empty = false
    placeholder_text = <span foreground="##bbbbbb">Digite sua senha</span>
    fail_text = <span foreground="##ff6b6b">Senha incorreta ($ATTEMPTS)</span>
    position = 0, -62
    halign = center
    valign = center
}

# ------------------------------------------------------------------ rodapé

label {
    monitor =
    text = cmd[update:5000] rice-lock-info cpu
    color = rgba(255, 255, 255, 0.80)
    font_size = 13
    font_family = Fira Sans
    position = -210, -142
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] rice-lock-info ram
    color = rgba(255, 255, 255, 0.80)
    font_size = 13
    font_family = Fira Sans
    position = -40, -142
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] rice-lock-info bat
    color = rgba(255, 255, 255, 0.80)
    font_size = 13
    font_family = Fira Sans
    position = 90, -142
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] rice-lock-info weather
    color = rgba(255, 255, 255, 0.80)
    font_size = 13
    font_family = Fira Sans
    position = 215, -142
    halign = center
    valign = center
}

label {
    monitor =
    # Fica vazio quando nada está tocando, e a linha some sozinha.
    text = cmd[update:3000] rice-lock-info media
    color = $lock_accent
    font_size = 13
    font_family = Fira Sans Medium
    position = 0, -175
    halign = center
    valign = center
}

# ------------------------------------------------------- fora do cartão

# Quantas notificações esperam do outro lado. Some quando não há nenhuma.
label {
    monitor =
    text = cmd[update:10000] rice-lock-info notifs
    color = rgba(255, 255, 255, 0.55)
    font_size = 12
    font_family = Fira Sans
    position = 0, 62
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] rice-lock-info host
    color = rgba(255, 255, 255, 0.45)
    font_size = 12
    font_family = Fira Sans
    position = 24, 18
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] rice-lock-info uptime
    color = rgba(255, 255, 255, 0.45)
    font_size = 12
    font_family = Fira Sans
    position = -24, 18
    halign = right
    valign = bottom
}

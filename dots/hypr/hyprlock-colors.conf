# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Cores da tela de bloqueio. Regravado pelo wallust a cada troca de wallpaper —
# esta cópia só existe para a primeira instalação, antes do primeiro `wallust
# run`, porque o hyprlock.conf faz `source` deste arquivo e falharia sem ele.
# Editar o template em: ~/.config/wallust/templates/hyprlock-colors.conf
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

$lock_accent = rgb(22D3EE)
$lock_accent2 = rgb(3B82F6)
$lock_fg = rgb(E2E8F0)
$lock_bg = rgb(111218)

# Config do cava só pra alimentar as barrinhas de áudio da aba Mídia do
# hub (Media.qml, via Quickshell.Io.Process). Não é o cava "visual" de
# terminal — saída raw em ASCII, uma linha por frame, valores 0-100
# separados por ";".
[general]
bars = 44
framerate = 30

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59

[smoothing]
noise_reduction = 55

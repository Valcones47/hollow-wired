# Config do cava só pro nível de som do disco da mídia na barra (MediaState,
# via Quickshell.Io.Process). Poucas faixas e baixa taxa: só a média importa.
# O Media.qml (aba Mídia do hub) usa o cava.conf, com 44 faixas.
[general]
bars = 8
framerate = 30

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59

[smoothing]
noise_reduction = 60

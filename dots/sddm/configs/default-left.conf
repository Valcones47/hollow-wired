[General]
enable-animations = true
animated-background-placeholder = ""

[LockScreen]
display = true
padding-top = 72
padding-right = 0
padding-bottom = 64
padding-left = 64
background = "current.png"
use-background-color = false
background-color = "#170D0C"
blur = 10
brightness = -0.10

[LockScreen.Clock]
display = true
position = top-left
align = center
format = hh:mm
font-family = Noto Sans
font-size = 112
font-weight = 700
color = "#C2A6A5"

[LockScreen.Date]
display = true
format = dddd, d 'de' MMMM
font-family = Noto Sans
font-size = 22
font-weight = 500
color = "#AA8F8E"
margin-top = -12

[LockScreen.Message]
display = true
position = bottom-left
align = left
text = Pressione qualquer tecla para entrar
font-family = Noto Sans
font-size = 17
font-weight = 400
display-icon = true
icon = enter.svg
icon-size = 20
color = "#AA8F8E"
paint-icon = true
spacing = 10

[LoginScreen]
background = "current.png"
use-background-color = false
background-color = "#170D0C"
blur = 40
brightness = -0.30

[LoginScreen.LoginArea]
position = center
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = circle
border-radius = 60
active-size = 120
inactive-size = 75
inactive-opacity = 0.40
active-border-size = 3
inactive-border-size = 1
active-border-color = "#A62727"
inactive-border-color = "#775F5E"

[LoginScreen.LoginArea.Username]
font-family = Noto Sans
font-size = 18
font-weight = 700
color = "#C2A6A5"
margin = 12

[LoginScreen.LoginArea.PasswordInput]
width = 270
height = 44
display-icon = true
font-family = Noto Sans
font-size = 13
icon = password.svg
icon-size = 16
content-color = "#C2A6A5"
background-color = "#170D0C"
background-opacity = 0.75
border-size = 1
border-color = "#A62727"
border-radius-left = 22
border-radius-right = 22
margin-top = 10

[LoginScreen.LoginArea.LoginButton]
background-color = "#A62727"
background-opacity = 0.85
active-background-color = "#A62727"
active-background-opacity = 1.0
content-color = "#170D0C"
active-content-color = "#170D0C"
border-size = 0
border-radius = 22
size = 44
icon-size = 20

[LoginScreen.LoginArea.Spinner]
display = true
size = 38
color = "#A62727"

[LoginScreen.LoginArea.WarningMessage]
font-family = Noto Sans
font-size = 11
font-weight = 500
color = "#A62727"
margin-top = 8

[LoginScreen.MenuArea.Buttons]
size = 38
font-family = Noto Sans
border-radius = 19
margin = 24

[LoginScreen.MenuArea.Popups]
max-height = 240
item-height = 38
item-spacing = 4
padding = 8
display-scrollbar = true
margin = 8
background-color = "#170D0C"
background-opacity = 0.90
active-option-background-color = "#A62727"
active-option-background-opacity = 0.30
content-color = "#C2A6A5"
active-content-color = "#A62727"
font-family = Noto Sans
border-size = 1
border-color = "#A62727"
font-size = 13
icon-size = 20

[LoginScreen.MenuArea.Session]
display = true
position = bottom-left
index = 0
popup-direction = up
popup-align = left
display-session-name = true
button-width = 220
popup-width = 240
background-color = "#170D0C"
background-opacity = 0.70
active-background-opacity = 0.90
content-color = "#C2A6A5"
active-content-color = "#A62727"
border-size = 1
font-size = 13
icon-size = 20

[LoginScreen.MenuArea.Layout]
display = false
position = bottom-right
index = 1
popup-direction = up
popup-align = center
popup-width = 180
display-layout-name = true
background-color = "#170D0C"
background-opacity = 0.70
active-background-opacity = 0.90
content-color = "#C2A6A5"
active-content-color = "#A62727"
border-size = 1
font-size = 11
icon = language.svg
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = bottom-right
index = 1
background-color = "#170D0C"
background-opacity = 0.70
active-background-opacity = 0.90
content-color = "#C2A6A5"
active-content-color = "#A62727"
border-size = 1
icon = keyboard.svg
icon-size = 18

[LoginScreen.MenuArea.Power]
display = true
position = bottom-right
index = 0
popup-direction = up
popup-align = center
popup-width = 160
background-color = "#170D0C"
background-opacity = 0.70
active-background-opacity = 0.90
content-color = "#C2A6A5"
active-content-color = "#A62727"
border-size = 1
icon = power.svg
icon-size = 18

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = login
start-hidden = true
background-color = "#170D0C"
background-opacity = 0.85
key-color = "#231413"
key-opacity = 0.95
key-content-color = "#C2A6A5"
key-active-background-color = "#A62727"
key-active-opacity = 1.0
selection-background-color = "#A62727"
selection-content-color = "#170D0C"
primary-color = "#A62727"
border-size = 1
border-color = "#775F5E"

[Tooltips]
display = true
padding = 6
font-family = Noto Sans
font-size = 11
color = "#C2A6A5"
background-color = "#170D0C"
background-opacity = 0.90
border-radius = 6
border-size = 1
border-color = "#775F5E"
